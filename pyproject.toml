[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devbrief-agent"
version = "0.1.0"
description = "Evidence-driven, recoverable Agent Harness prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]

[project.scripts]
devbrief = "devbrief.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
  "pyright>=1.1.380,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devbrief = [
  "integration/static/**/*.html",
  "integration/static/**/*.css",
  "integration/static/**/*.js",
  "integration/static/**/*.png",
  "integration/static/**/*.ico",
  "integration/static/**/*.svg",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
